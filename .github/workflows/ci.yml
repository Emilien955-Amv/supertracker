# Intégration continue : à chaque « push » et à chaque « pull request »,
# GitHub vérifie automatiquement que le projet est sain.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si on pousse deux fois de suite, on annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typage, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Vrais services PostgreSQL et Redis pour les tests d'intégration.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supertracker
          POSTGRES_PASSWORD: supertracker
          POSTGRES_DB: supertracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supertracker"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://supertracker:supertracker@localhost:5432/supertracker_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatage (ruff format)
        run: ruff format --check .

      - name: Typage (mypy)
        run: mypy app

      - name: Migrations (aller-retour complet)
        # On vérifie que les migrations s'appliquent ET s'annulent proprement.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests et couverture
        run: pytest --cov --cov-report=term --cov-report=xml

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Build de production
        run: npm run build

  docker:
    name: Construction des images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Image backend
        run: docker build -t supertracker-api:ci backend

      - name: Image frontend
        run: docker build -t supertracker-web:ci frontend
