# Environnement de développement local de SuperTracker.
# Lancement : docker compose up --build
#
# Les services :
#   db    -> PostgreSQL, la base de données principale
#   redis -> cache et, plus tard, file de tâches (Celery)
#   api   -> le backend FastAPI (http://localhost:8000/api/docs)
#   web   -> le frontend React (http://localhost:5173)

name: supertracker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Volume nommé : les données survivent à un « docker compose down ».
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # L'API ne démarre que lorsque PostgreSQL répond réellement.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        # En local, on installe aussi les outils de test et de lint.
        INSTALL_DEV: "true"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # « db » et « redis » sont les noms des services : Docker les résout
      # automatiquement en adresses sur le réseau interne du projet.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      REDIS_URL: redis://redis:6379/0
      # Clé de signature des jetons. La valeur par défaut ne convient qu'en local.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-a-changer-0123456789abcdef}
      # Jeton d'accès à l'API TMDB (films et séries), lu depuis le fichier .env.
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      # Sous Windows, les modifications de fichiers ne sont pas toujours
      # signalées au conteneur : on force la surveillance par scrutation.
      WATCHFILES_FORCE_POLLING: "true"
    # 1) applique les migrations, 2) démarre le serveur avec rechargement auto.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      # Le code local est monté dans le conteneur : toute modification
      # est prise en compte sans reconstruire l'image.
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      # Vite redirige les appels /api vers le conteneur de l'API.
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
      # Volume anonyme : on garde les node_modules installés DANS l'image
      # au lieu de les écraser par le dossier local (souvent vide).
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
