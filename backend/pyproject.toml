# Configuration des outils Python (les dépendances sont dans requirements*.txt).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F : erreurs classiques, I : ordre des imports, UP : syntaxe moderne,
# B : pièges fréquents (bugbear), S : règles de sécurité (bandit).
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Dans les tests, « assert » est normal.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: nécessite PostgreSQL et Redis démarrés (exclure avec -m 'not integration')",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy asynchrone s'appuie sur des « greenlets » : il faut le signaler
# à coverage, sinon le code exécuté à travers eux n'est pas comptabilisé.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_empty = true
